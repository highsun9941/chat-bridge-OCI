[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-bridge-oci"
version = "0.2.0"
description = "Root-level MCP bridge for using ChatGPT web chat as an OCI instance management agent"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2,<3",
]

[project.scripts]
chat-bridge-oci = "server:main"

[tool.setuptools]
py-modules = ["server"]
